[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-scanner"
version = "1.0.0"
description = "Local, read-only security scanner for Next.js and Supabase projects"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Cyprian Tinashe Aarons" }]
license = { file = "LICENSE" }
keywords = ["security", "nextjs", "supabase", "static-analysis", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]
dependencies = ["typer>=0.12", "rich>=13.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]
mcp = ["mcp[cli]>=1.0"]

[project.urls]
Homepage = "https://github.com/CyprianTinasheAarons/vibe-scanner"
Repository = "https://github.com/CyprianTinasheAarons/vibe-scanner"
Issues = "https://github.com/CyprianTinasheAarons/vibe-scanner/issues"

[project.scripts]
vibe-scanner = "cli:app"

[tool.setuptools]
py-modules = ["cli", "core", "mcp_server", "scanner", "url_scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
